name: release

# Pushing a release tag (vX.Y.Z) to LogosLang:
#   1. creates the GitHub Release,
#   2. builds a per-OS/arch artifact and uploads it under the naming convention the
#      website's download page reads:  logos-<tag>-<os>-<arch>.<ext>
#        os   = macos | linux | windows
#        arch = x86_64 | aarch64
#        ext  = tar.gz (macos, linux) | zip (windows)
#   3. notifies the website (repository_dispatch `logoslang-release`), which freezes
#      the docs at this version and fires a deploy hook so the new build + docs
#      appear together.
#
# Requires repo secret WEBSITE_DISPATCH_TOKEN: a fine-grained PAT scoped to
# ThobiasKnudsen/LogosLangWebsite with Contents: read & write (the default
# GITHUB_TOKEN cannot dispatch cross-repo).

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write # create the release and upload assets

# Process one release at a time. If two version tags are pushed close together, the
# second waits for the first instead of racing it (and none are dropped).
concurrency:
  group: logoslang-release
  cancel-in-progress: false

jobs:
  # Fail fast on a bad tag before anything is built or any release is created:
  # the tag must be strict semver vX.Y.Z and strictly newer than every existing tag.
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true
      - name: Validate the release tag (format + strictly newer)
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if ! printf '%s' "$TAG" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::Tag '$TAG' is not a strict version vX.Y.Z (e.g. v0.0.3)."
            exit 1
          fi
          cur="${TAG#v}"
          # `|| true` for the same reason docs-check.sh's latest_release_tag has it:
          # when this tag is the only one (every first release, and any release made
          # before another tag exists), `grep -vx "$TAG"` filters everything out and
          # exits 1, which under `set -o pipefail` aborts the assignment and fails the
          # gate with no error message. An empty `highest` is the correct answer here,
          # not a failure — it means there is no previous release to be newer than.
          highest="$(
            {
              git tag --list 'v*.*.*' \
                | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' \
                | grep -vx "$TAG" \
                | sed 's/^v//' \
                | sort -V | tail -n1
            } || true
          )"
          if [ -n "$highest" ]; then
            newest="$(printf '%s\n%s\n' "$cur" "$highest" | sort -V | tail -n1)"
            if [ "$newest" = "$highest" ]; then
              echo "::error::Tag '$TAG' is not newer than the latest release 'v$highest'. Release versions must strictly increase."
              exit 1
            fi
          fi
          echo "OK: $TAG is a valid release tag (previous highest: ${highest:+v}${highest:-none})."

      - name: Verify the docs are consistent for this release
        # Every in-progress doc (version > the previous release R) must be named
        # exactly $TAG, so the snapshot set this tag freezes is internally consistent.
        # The website renders these same files; the guard lives in .github/scripts.
        env:
          TAG: ${{ github.ref_name }}
        run: bash .github/scripts/docs-check.sh release "$TAG"

  create-release:
    needs: gate
    runs-on: ubuntu-latest
    steps:
      - name: Create the GitHub Release for this tag (idempotent)
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $TAG already exists."
          else
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --title "$TAG" --generate-notes
          fi

  build:
    needs: create-release
    strategy:
      fail-fast: false
      # `native: true` means the artifact runs on the runner that built it, which is
      # the only place the smoke test below can execute it.
      #
      # Intel macOS is cross-compiled from an Apple Silicon runner rather than built
      # on macos-13. In the v0.0.4 release the macos-13 job sat queued for 25+ minutes
      # while every other job finished in 2-4 and never started, so that release
      # shipped 4 of 5 archives. macos-13 is the last Intel image and is being wound
      # down; macos-14's Xcode toolchain targets both arches, so cross-compiling
      # removes the dependency on a runner pool that may not come back.
      matrix:
        include:
          - { os: linux, arch: x86_64, runner: ubuntu-latest, ext: tar.gz, target: x86_64-unknown-linux-gnu, native: true }
          - { os: linux, arch: aarch64, runner: ubuntu-latest, ext: tar.gz, target: aarch64-unknown-linux-gnu, native: false }
          - { os: macos, arch: x86_64, runner: macos-14, ext: tar.gz, target: x86_64-apple-darwin, native: false }
          - { os: macos, arch: aarch64, runner: macos-14, ext: tar.gz, target: aarch64-apple-darwin, native: true }
          - { os: windows, arch: x86_64, runner: windows-latest, ext: zip, target: x86_64-pc-windows-msvc, native: true }
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - name: Add the Rust target
        shell: bash
        run: rustup target add ${{ matrix.target }}

      # ubuntu-latest is x86_64, so the aarch64 Linux artifact is cross-compiled and
      # needs a cross linker. Every other matrix entry builds natively on its runner.
      - name: Install the cross linker (linux/aarch64)
        if: matrix.os == 'linux' && matrix.arch == 'aarch64'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: seed
          key: ${{ matrix.target }}

      - name: Build the seed
        shell: bash
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
        run: cargo build --release --locked --manifest-path seed/Cargo.toml --target ${{ matrix.target }}

      # Smoke-test what we are about to ship, everywhere the artifact is native to its
      # runner. Cross-compiled artifacts (aarch64 Linux, Intel macOS) cannot run here.
      - name: Smoke-test the binary
        if: matrix.native
        shell: bash
        run: |
          set -euo pipefail
          BIN="seed/target/${{ matrix.target }}/release/logos"
          [ "${{ matrix.os }}" = "windows" ] && BIN="${BIN}.exe"
          "$BIN" --help > /dev/null
          out="$("$BIN" seed/examples/answer.logos | tail -n1)"
          [ "$out" = "42" ] || { echo "::error::smoke test: expected 42, got '$out'"; exit 1; }
          echo "OK: $BIN runs and answer.logos evaluates to 42."

      - name: Stage the archive
        shell: bash
        env:
          TAG: ${{ github.ref_name }}
          OS: ${{ matrix.os }}
          ARCH: ${{ matrix.arch }}
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          STAGE="logos-${TAG}-${OS}-${ARCH}"
          mkdir -p "$STAGE/bin"
          # Cargo.toml pins the binary name to `logos`; the download page and the
          # install docs both promise it at bin/logos.
          if [ "$OS" = "windows" ]; then
            cp "seed/target/${TARGET}/release/logos.exe" "$STAGE/bin/logos.exe"
          else
            cp "seed/target/${TARGET}/release/logos" "$STAGE/bin/logos"
            chmod +x "$STAGE/bin/logos"
          fi
          # Apache-2.0 section 4 requires these to travel with the binary.
          cp LICENSE NOTICE TRADEMARK.md "$STAGE/"
          cp -r seed/examples "$STAGE/examples"
          printf 'Logos %s (%s/%s)\n\nRun a file:  bin/logos examples/answer.logos\nREPL:        bin/logos\nHelp:        bin/logos --help\n\nThis is the bootstrap seed: it parses source into the Logic Graph,\ninterprets it, and lowers explicitly compiled functions to Cranelift.\nIt is not the finished language. What this release does and does not\nrun is listed at https://logoslang.dev/docs/getting-started/install/\n' "$TAG" "$OS" "$ARCH" > "$STAGE/README.txt"
          echo "STAGE=$STAGE" >> "$GITHUB_ENV"

      - name: Package (tar.gz)
        if: matrix.ext == 'tar.gz'
        shell: bash
        run: tar -czf "${STAGE}.tar.gz" "$STAGE"

      - name: Package (zip)
        if: matrix.ext == 'zip'
        shell: pwsh
        run: Compress-Archive -Path "$env:STAGE" -DestinationPath "$($env:STAGE).zip"

      - name: Upload the artifact to the release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: gh release upload "$TAG" "${STAGE}.${{ matrix.ext }}" --repo "$GITHUB_REPOSITORY" --clobber

  # No `logos-<tag>-wasm.wasm` asset is produced yet. The seed's run tier is a
  # Cranelift JIT, which emits native code for the host and does not target
  # wasm32, so there is nothing honest to upload. The website reads the absence
  # correctly: with no release shipping wasm, the playground shows its
  # "arrives with the first release that ships a WASM build" state rather than
  # loading an empty module and appearing broken. Restore a `build-wasm` job
  # (and add it back to notify-website's `needs`) once an interpreter-only
  # wasm32 build exists.

  notify-website:
    needs: [build]
    runs-on: ubuntu-latest
    steps:
      - name: Notify the website (freeze docs + refresh downloads)
        env:
          TOKEN: ${{ secrets.WEBSITE_DISPATCH_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          curl -sf -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/ThobiasKnudsen/LogosLangWebsite/dispatches \
            -d "{\"event_type\":\"logoslang-release\",\"client_payload\":{\"version\":\"${TAG}\"}}"
          echo "Dispatched logoslang-release for ${TAG}."
