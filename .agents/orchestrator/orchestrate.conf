# Read by ~/.claude/skills/orchestrate/orchestrate.sh as KEY=value text. The script runs nothing
# from this file; GATE and DOCS_GATE are handed to the agents as the commands they must run.
PROJECT=logoslang
BASE=dev
RULING_DOC=DESIGN.md
CACHE_DIRS=target
GATE=`cargo fmt --check`, `bash .github/scripts/comment-check.sh`, `cargo clippy --release --all-targets -- -D warnings`, `cargo build --release`, `cargo test --release`, `cargo test`
DOCS_GATE=`bash .github/scripts/docs-check.sh validate`
QUESTION_COMMITS=on
